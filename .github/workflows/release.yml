# Builds XrealScreen-<version>-x64.msi (ADR-0013) and attaches it to the GitHub release.
#
# Trigger: publish a release with a tag like v0.2.0 (version = tag without "v"), or run it by hand
# (Actions -> Release MSI -> Run workflow) to get the MSI as a workflow artifact.
#
# Driver: built from source and signed with the driver TEST certificate from two repository secrets
# (Settings -> Secrets and variables -> Actions):
#   DRIVER_PFX_BASE64    base64 of installer\.signing\driver\XrealScreen-driver.pfx
#   DRIVER_PFX_PASSWORD  content of installer\.signing\driver\pfx-password.txt
# Without them the MSI is built without the driver page (warning in the log).
name: Release MSI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z)'
        required: true
        default: '0.1.0'

permissions:
  contents: write   # upload the MSI to the release

jobs:
  msi:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DRIVER_PFX_BASE64: ${{ secrets.DRIVER_PFX_BASE64 }}
      DRIVER_PFX_PASSWORD: ${{ secrets.DRIVER_PFX_PASSWORD }}
    defaults:
      run:
        shell: powershell   # the installer scripts target Windows PowerShell 5.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        run: |
          $v = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ inputs.version }}' }
          $v = $v.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version '$v' must be x.y.z (tag v1.2.3)" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Driver signing certificate
        if: env.DRIVER_PFX_BASE64 != ''
        run: |
          $dir = 'installer\.signing\driver'
          New-Item -ItemType Directory -Force $dir | Out-Null
          [IO.File]::WriteAllBytes("$PWD\$dir\XrealScreen-driver.pfx", [Convert]::FromBase64String($env:DRIVER_PFX_BASE64))
          Set-Content "$dir\pfx-password.txt" $env:DRIVER_PFX_PASSWORD -NoNewline

      - name: Driver toolchain (WDK 10.0.26100, LLVM 18.1.8)
        if: env.DRIVER_PFX_BASE64 != ''
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (-not (Test-Path "$kits\bin\10.0.26100.0\x86\Inf2Cat.exe") -or -not (Test-Path "$kits\Include\wdf")) {
            Invoke-WebRequest 'https://download.microsoft.com/download/41fb59c2-1723-45f9-a270-96b73ad58233/KIT_BUNDLE_WDK_MEDIACREATION/wdksetup.exe' -OutFile "$env:RUNNER_TEMP\wdksetup.exe"
            Start-Process "$env:RUNNER_TEMP\wdksetup.exe" -ArgumentList '/quiet', '/norestart', '/features', '+' -Wait
          }
          # bindgen 0.70 in this driver needs libclang 18 (newer LLVM emits empty structs, ADR-0005)
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe' -OutFile "$env:RUNNER_TEMP\llvm18.exe"
          Start-Process "$env:RUNNER_TEMP\llvm18.exe" -ArgumentList '/S', '/D=C:\llvm-18' -Wait
          if (-not (Test-Path 'C:\llvm-18\bin\libclang.dll')) { throw 'LLVM 18 install failed' }

      - name: Build driver
        if: env.DRIVER_PFX_BASE64 != ''
        run: .\installer\driver\Build-Driver.ps1 -Source "$env:RUNNER_TEMP\virtual-display-rs" -LibClang 'C:\llvm-18\bin'

      - name: Build MSI
        run: .\installer\Build-Msi.ps1 -Version ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: XrealScreen-${{ steps.version.outputs.value }}-x64.msi
          path: artifacts/msi/XrealScreen-${{ steps.version.outputs.value }}-x64.msi

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' 'artifacts\msi\XrealScreen-${{ steps.version.outputs.value }}-x64.msi' --clobber
